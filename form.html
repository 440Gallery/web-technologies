<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login and Register</title>
</head>
<body>
    <h2 id="form-title">Login Form</h2>

    <form id="login-form" action="submit.php" method="post">
        <label for="login-name">UserName:</label>
        <input type="text" id="login-name" name="name"><br><br>

        <label for="login-email">Email:</label>
        <input type="email" id="login-email" name="email"><br><br>

        <label for="login-password">Password:</label>
        <input type="password" id="login-password" name="password"><br><br>

        <input type="submit" value="Login">
        <button type="button" onclick="showRegisterForm()">Register</button>
    </form>

    <h2 id="form-title">register Form</h2>

    <form id="register-form" class="hidden" action="register.php" method="post">
        <label for="register-name">UserName:</label>
        <input type="text" id="register-name" name="name"><br><br>

        <label for="register-email">Email:</label>
        <input type="email" id="register-email" name="email"><br><br>

        <label for="date">Date of Birth:</label>
        <input type="date" id="date" name=" date"><br><br>

        <label for="register-password">Password:</label>
        <input type="password" id="register-password" name="password"><br><br>

        <label for="confirm-password">Confirm Password:</label>
        <input type="password" id="confirm-password" name="confirm_password"><br><br>

        <input type="submit" value="Create Account">
        <button type="button" onclick="showLoginForm()">Back to Login</button>
    </form>

    </body>
</html>
